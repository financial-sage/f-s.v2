<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    Matches public/icons/icon-512.png:
    navy #000033 | warm gold gradient | white fp monogram on S-curve stem
  -->
  <defs>
    <linearGradient id="gold" x1="300" y1="256" x2="500" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B07D4A"/>
      <stop offset="0.5" stop-color="#C18E58"/>
      <stop offset="1" stop-color="#CA9764"/>
    </linearGradient>
    <clipPath id="appIcon">
      <rect x="24" y="28" width="464" height="452" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <g clip-path="url(#appIcon)">
    <rect width="512" height="512" fill="#000033"/>

    <!--
      Gold sits to the RIGHT of the stem.
      Left edge follows the stem centerline (S-curve) so the white stroke straddles the split.
    -->
    <path
      fill="url(#gold)"
      d="M278 28
         C270 70 262 110 258 150
         C255 190 255 220 255 256
         C255 310 250 370 238 415
         C228 445 210 470 190 500
         L512 500 L512 28 Z"
    />

    <g
      fill="none"
      stroke="#FFFFFF"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <!-- Vertical S-stem -->
      <path
        stroke-width="44"
        d="M278 52
           C268 95 260 135 257 175
           C254 220 255 270 255 320
           C255 375 242 420 212 458"
      />

      <!-- F cross-bars (left) -->
      <path stroke-width="38" d="M150 176 H270"/>
      <path stroke-width="38" d="M130 314 H270"/>

      <!-- P bowl (right) -->
      <path
        stroke-width="42"
        d="M270 198
           C325 198 392 212 392 248
           C392 284 325 298 270 298"
      />
    </g>
  </g>
</svg>
