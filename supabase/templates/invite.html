<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Invitación · SinDescuadre</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f1eb;
      font-family: Georgia, 'Times New Roman', Times, serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f4f1eb; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 520px;
              background-color: #fffcf7;
              border-radius: 20px;
              border: 1px solid #e8e2d6;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="
                  background: linear-gradient(135deg, #1c2740 0%, #2e3c5a 100%);
                  padding: 28px 32px 24px;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                      Roboto, Helvetica, Arial, sans-serif;
                    font-size: 11px;
                    font-weight: 500;
                    letter-spacing: 0.22em;
                    text-transform: uppercase;
                    color: #c4a574;
                  "
                >
                  SinDescuadre
                </p>
                <p
                  style="
                    margin: 10px 0 0;
                    font-family: Georgia, 'Times New Roman', Times, serif;
                    font-size: 26px;
                    font-weight: 400;
                    line-height: 1.25;
                    color: #f7f4ef;
                  "
                >
                  Te han invitado
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding: 28px 32px 8px">
                <p
                  style="
                    margin: 0;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                      Roboto, Helvetica, Arial, sans-serif;
                    font-size: 15px;
                    font-weight: 300;
                    line-height: 1.55;
                    color: #3d4554;
                  "
                >
                  Alguien te ha invitado a SinDescuadre, el espacio para
                  ordenar las finanzas en pareja o en familia, con claridad y
                  sin culpa.
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding: 24px 32px 8px">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td
                      align="center"
                      style="border-radius: 14px; background-color: #c4a574"
                    >
                      <a
                        href="{{ .ConfirmationURL }}"
                        target="_blank"
                        style="
                          display: inline-block;
                          padding: 14px 28px;
                          font-family: -apple-system, BlinkMacSystemFont,
                            'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                          font-size: 14px;
                          font-weight: 600;
                          color: #1c2740;
                          text-decoration: none;
                        "
                      >
                        Aceptar invitación
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding: 20px 32px 28px">
                <div
                  style="
                    height: 1px;
                    background-color: #ebe6dc;
                    margin-bottom: 18px;
                  "
                ></div>
                <p
                  style="
                    margin: 0;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                      Roboto, Helvetica, Arial, sans-serif;
                    font-size: 12px;
                    font-weight: 300;
                    line-height: 1.5;
                    color: #8a909c;
                  "
                >
                  Si no esperabas esta invitación, puedes ignorar el correo.
                </p>
              </td>
            </tr>
          </table>

          <p
            style="
              margin: 20px 0 0;
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                Helvetica, Arial, sans-serif;
              font-size: 11px;
              font-weight: 300;
              color: #9aa0aa;
            "
          >
            Claridad antes que control · SinDescuadre
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
